services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: foodsafe_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodsafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodsafe_pass}
      POSTGRES_DB: ${POSTGRES_DB:-foodsafe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodsafe_user} -d ${POSTGRES_DB:-foodsafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodsafe_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-foodsafe_user}:${POSTGRES_PASSWORD:-foodsafe_pass}@db:5432/${POSTGRES_DB:-foodsafe_db}
      SECRET_KEY: ${SECRET_KEY:-foodsafe-super-secret-jwt-key-2026-production-ready}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://127.0.0.1"]'
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. React Frontend & NGINX Reverse Proxy Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodsafe_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
